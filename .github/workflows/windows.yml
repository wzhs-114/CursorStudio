name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated self-test
        shell: pwsh
        run: ./Tests/Test.ps1
      - name: Package public release
        shell: pwsh
        run: ./Tools/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CursorStudio-Windows11
          path: dist/CursorStudio-1.0.0-Windows11.zip
          if-no-files-found: error
